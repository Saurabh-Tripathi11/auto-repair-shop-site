# Builds every tenant with `shopfront` and publishes dist/ to GitHub Pages.
#
# `platform/build.js` writes each tenant to dist/<slug>/ plus a directory page
# at dist/index.html. This workflow rearranges that afterward, GitHub-Pages-
# demo-only, and doesn't change what `npm run build` itself produces:
#
#   https://demo.sachintripathi.com/               ROOT_TENANT's own page
#   https://demo.sachintripathi.com/vaughn-auto/    every tenant still at its
#   https://demo.sachintripathi.com/pacific-euro/   own path too, unchanged
#   https://demo.sachintripathi.com/CHECK_PATH/     the directory page, moved
#                                                    here from dist/index.html
#
# Requirements this workflow cannot set up by itself:
#   1. The repo must be public, or on a GitHub plan with private Pages.
#   2. DNS: a CNAME record for the custom domain below, pointed at
#      <owner>.github.io (see README's Deploying section for the exact record).
#   3. Pages must be turned on once, manually: Settings -> Pages -> Build and
#      deployment -> Source -> "GitHub Actions". The default GITHUB_TOKEN
#      can deploy to a Pages site but can't create one -- that needs
#      administration-level access GitHub deliberately withholds from it.
#
# To point this at a different domain, change CUSTOM_DOMAIN below (or delete
# that env and the "Write CNAME" step to publish to the default
# <owner>.github.io/<repo>/ URL instead).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you deploy from any branch via the Actions tab, before merging to main

env:
  CUSTOM_DOMAIN: demo.sachintripathi.com
  ROOT_TENANT: vaughn-auto # which tenant's page loads at the bare domain
  CHECK_PATH: mai/sachin/hoon # where the all-tenants directory page moves to

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather
# than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero dependencies -- no install step. `npm run check` fails the run on
      # a real config or contrast error before anything is published.
      - run: npm run check
      - run: npm run build

      - name: Promote ROOT_TENANT to the site root, move the directory page to CHECK_PATH
        run: |
          set -e
          test -d "dist/$ROOT_TENANT" || { echo "::error::ROOT_TENANT '$ROOT_TENANT' has no dist/$ROOT_TENANT -- check the tenant slug"; exit 1; }
          mkdir -p "dist/$CHECK_PATH"
          mv dist/index.html "dist/$CHECK_PATH/index.html"
          cp -r "dist/$ROOT_TENANT/." dist/

      - name: Bypass Jekyll processing
        run: touch dist/.nojekyll

      - name: Write CNAME for the custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME

      # This step deploys to a Pages site; it cannot create one. Creating the
      # site the first time needs an admin-level token the default
      # GITHUB_TOKEN is deliberately not given, even with `pages: write` and
      # `enablement: true` here -- that combination fails with "Resource not
      # accessible by integration". The one-time fix is a manual Settings
      # step, not a workflow one: Settings -> Pages -> Build and deployment ->
      # Source -> "GitHub Actions". Do that once; every run after (this one
      # included) needs nothing further.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
